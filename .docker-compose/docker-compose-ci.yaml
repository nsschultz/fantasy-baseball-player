version: "3.8"
services:
  api:
    build:
      context: ../
      dockerfile: Dockerfile
      target: ci
    command: sh /scripts/scan.sh
    depends_on:
      database:
        condition: service_healthy
      mountebank:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PLAYER_DATABASE=player_database
      - PLAYER_DATABASE_HOST=database
      - PLAYER_DATABASE_PASSWORD=postgres
      - PLAYER_DATABASE_USER=postgres
      - POSITION_SERVICE_HOST=mountebank:5555
      - POSITION_SERVICE_VERSION=v1
      - SERVICE=fantasy-baseball-player
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SONAR_TOKEN=${SONAR_TOKEN}
      - VERSION=${VERSION}
    volumes:
      - ../:/app/
  database:
    build: database/
    restart: always
    user: postgres
    environment:
      - POSTGRES_DB=player_database
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 60s
      timeout: 30s
      retries: 5
    volumes:
      - data_volume:/var/lib/postgresql/data
  mountebank:
    build: mountebank/
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2525/api/config"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data_volume:
